# 監視対象ソース定義
# - priority: high は入替が激しい重点監視、low は公開募集が薄い期待値低めの監視
# - watch_only: true はリンク抽出せずページ更新のみ通知
# - link_keywords / link_exclude でソースごとにリンク抽出を調整可能
# - disabled: true で一時停止

